[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safegait"
version = "0.1.0"
description = "Safety validation of action chunks for whole-body control of mobile and walking manipulators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
physics = ["mujoco>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "ros2_ws/src/safegait_ros/test"]
pythonpath = ["ros2_ws/src/safegait_ros"]
